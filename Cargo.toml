[package]
edition = "2024"
name    = "oxifoc-remote-stick"
version = "0.1.0"

[[bin]]
name = "oxifoc-remote-stick"
path = "./src/bin/main.rs"

[dependencies]
defmt = "1.2"

critical-section = "1.2.0"
embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-sync = "0.8"
embassy-embedded-hal = "0.6"
embassy-time = { version = "0.5.1", features = ["defmt"] }
static_cell = { version = "2.1.1", features = ["nightly"] }
axp192-dd = { version = "0.4", features = ["defmt"] }
embedded-hal-async = "1.0.0"
embedded-hal = "1.0"
embedded-graphics = "0.8.2"
lcd-async = { git = "https://github.com/okhsunrog/lcd-async", version = "0.1.3", rev = "ab6b71d6" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c72d6805fce0764bbe97d1e97a47896c6d4744bf", version = "1.2.0", features = ["esp32", "unstable", "defmt"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c72d6805fce0764bbe97d1e97a47896c6d4744bf", version = "1.0.0-beta.2", features = ["esp32", "ble", "unstable", "defmt"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c72d6805fce0764bbe97d1e97a47896c6d4744bf", version = "0.4.0", features = ["esp32", "embassy", "esp-radio", "esp-alloc", "defmt"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c72d6805fce0764bbe97d1e97a47896c6d4744bf", version = "0.11.0", features = ["esp32", "defmt"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c72d6805fce0764bbe97d1e97a47896c6d4744bf", version = "0.6.0", features = ["esp32", "defmt"] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c72d6805fce0764bbe97d1e97a47896c6d4744bf", version = "0.20.0", features = ["esp32", "defmt", "panic-handler"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c72d6805fce0764bbe97d1e97a47896c6d4744bf", version = "0.18.0", features = ["esp32", "defmt-espflash"] }
embassy-futures = "0.1.2"
trouble-host = { git = "https://github.com/embassy-rs/trouble.git", rev = "042bd1c3bdc5980f66d28e0e698b6e579b15da4e", version = "0.8.0", default-features = false, features = ["defmt", "peripheral", "gatt", "derive", "default-packet-pool"] }
heapless = { version = "0.9.3", default-features = false }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
